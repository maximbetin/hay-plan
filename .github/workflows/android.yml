name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# PR builds cannot publish releases or modify repository contents.
permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      apk-name: ${{ steps.package.outputs.name }}
      version-name: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JetBrains JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: jetbrains
          java-version: '25'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Ignore yes's SIGPIPE, but still fail if sdkmanager itself fails.
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0'

      # Main releases must use the saved key so every APK remains update-compatible.
      # Never give PR code access to the saved signing key.
      - name: Restore saved test signing key
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for main builds.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          echo 'restored=true' >> "$GITHUB_OUTPUT"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey > /dev/null
          echo "HAY_PLAN_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'mode=Saved test signing key' >> "$GITHUB_OUTPUT"

      - name: Run tests, lint, and build
        shell: bash
        run: bash ./gradlew --no-daemon --console=plain -PhayPlanBuildNumber="$GITHUB_RUN_NUMBER" testDebugUnitTest lintRelease assembleRelease

      - name: Verify APK uses the saved test key
        if: steps.signing.outputs.restored == 'true'
        shell: bash
        run: |
          expected=$(keytool -exportcert -keystore "$HAY_PLAN_DEBUG_KEYSTORE" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [[ "$actual" != "$expected" ]]; then
            echo 'APK signing certificate does not match the saved test key.' >&2
            exit 1
          fi
          echo 'APK signing certificate matches the saved test key.'

      - name: Name the downloadable APK
        id: package
        shell: bash
        run: |
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          name="hay-plan-${version}-${GITHUB_SHA:0:7}.apk"
          mkdir -p "$RUNNER_TEMP/hay-plan-apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hay-plan-apk/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/hay-plan-apk/$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload downloadable APK
        id: apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to build summary
        shell: bash
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'Temporary debug key' }}
        run: |
          {
            echo '## Hay Plan APK ready'
            printf '\n[Download the APK](%s)\n\n' "$APK_URL"
            printf 'Signing: %s\n\n' "$SIGNING_MODE"
            echo 'Build artifacts are kept for 30 days. Phone downloads are available from the latest GitHub release.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove restored signing key
        if: always() && steps.signing.outputs.restored == 'true'
        shell: bash
        run: rm -f -- "$HOME/.android/debug.keystore"

  release:
    name: Publish automatic APK release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download this run's APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.apk-name }}
          path: apk

      - name: Publish installable APK and retain three automatic releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build.outputs.apk-name }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
        run: |
          tag="auto-${GITHUB_RUN_NUMBER}"
          cp "apk/$APK_NAME" hay-plan.apk
          notes="Automatically built and verified from main at ${GITHUB_SHA:0:7}. Download hay-plan.apk below and open it on your Android phone to install or update Hay Plan."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" hay-plan.apk --clobber
            gh release edit "$tag" --prerelease=false --latest --title "Hay Plan $VERSION_NAME" --notes "$notes"
          else
            gh release create "$tag" hay-plan.apk --target "$GITHUB_SHA" --prerelease=false --latest \
              --title "Hay Plan $VERSION_NAME" --notes "$notes"
          fi
          mapfile -t old_tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep '^auto-[0-9][0-9]*$' | sort -Vr | tail -n +4 || true)
          for old_tag in "${old_tags[@]}"; do
            gh release delete "$old_tag" --cleanup-tag --yes
          done

          {
            echo '## Hay Plan released'
            printf '\n[Download the latest APK](https://github.com/%s/releases/latest/download/hay-plan.apk)\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
