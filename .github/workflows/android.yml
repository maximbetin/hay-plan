name: Build Hay Plan APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JetBrains JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: jetbrains
          java-version: '25'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0'

      # Main builds use the same private key so each APK updates the installed app.
      # Pull requests build with the runner's temporary key and cannot publish.
      - name: Restore signing key
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for main builds.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey > /dev/null
          echo "HAY_PLAN_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and build release APK
        shell: bash
        run: bash ./gradlew --no-daemon --console=plain -PhayPlanBuildNumber="$GITHUB_RUN_NUMBER" testDebugUnitTest lintRelease assembleRelease

      - name: Verify signing and prepare download
        if: github.event_name == 'push'
        id: package
        shell: bash
        run: |
          expected=$(keytool -exportcert -keystore "$HAY_PLAN_DEBUG_KEYSTORE" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "$actual" == "$expected" ]] || { echo 'APK signing certificate does not match.' >&2; exit 1; }
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          cp app/build/outputs/apk/release/app-release.apk hay-plan.apk
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pass APK to publishing job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: hay-plan.apk
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing key
        if: always() && github.event_name == 'push'
        shell: bash
        run: rm -f -- "$HOME/.android/debug.keystore"

  publish:
    name: Publish APK
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hay-plan.apk
          path: apk

      - name: Publish latest APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="auto-${GITHUB_RUN_NUMBER}"
          notes="Built and verified from main at ${GITHUB_SHA:0:7}. Download hay-plan.apk below and open it on Android to install or update Hay Plan."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" apk/hay-plan.apk --clobber
            gh release edit "$tag" --prerelease=false --latest --title "Hay Plan $VERSION" --notes "$notes"
          else
            gh release create "$tag" apk/hay-plan.apk --target "$GITHUB_SHA" --prerelease=false --latest \
              --title "Hay Plan $VERSION" --notes "$notes"
          fi
          mapfile -t old_tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep '^auto-[0-9][0-9]*$' | sort -Vr | tail -n +4 || true)
          for old_tag in "${old_tags[@]}"; do
            gh release delete "$old_tag" --cleanup-tag --yes
          done
          {
            echo '## Hay Plan APK ready'
            printf '\n**Version:** %s\n\n' "$VERSION"
            printf '[Download hay-plan.apk](https://github.com/%s/releases/latest/download/hay-plan.apk)\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
