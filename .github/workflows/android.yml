name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# PR builds cannot publish releases or modify repository contents.
permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      apk-name: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JetBrains JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: jetbrains
          java-version: '25'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Ignore yes's SIGPIPE, but still fail if sdkmanager itself fails.
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-37' 'build-tools;36.0.0'

      # Optional: a standard Android debug keystore enables in-place test updates.
      # Never give PR code access to the saved signing key.
      - name: Restore optional test signing key
        id: signing
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo 'mode=Saved test signing key' >> "$GITHUB_OUTPUT"
            echo 'restored=true' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=Temporary debug key (updating may require uninstalling)' >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests, lint, and build
        shell: bash
        run: bash ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug

      - name: Name the downloadable APK
        id: package
        shell: bash
        run: |
          name="outing-debug-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}.apk"
          mkdir -p "$RUNNER_TEMP/outing-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/outing-apk/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/outing-apk/$name" >> "$GITHUB_OUTPUT"

      - name: Upload downloadable APK
        id: apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to build summary
        shell: bash
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'Temporary debug key' }}
        run: |
          {
            echo '## Outing APK ready'
            printf '\n[Download the APK](%s)\n\n' "$APK_URL"
            printf 'Signing: %s\n\n' "$SIGNING_MODE"
            echo 'Personal test build, not a Play Store release. Build artifacts are kept for 30 days.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove restored signing key
        if: always() && steps.signing.outputs.restored == 'true'
        shell: bash
        run: rm -f -- "$HOME/.android/debug.keystore"

  release:
    name: Attach APK to version release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download this run's APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.apk-name }}
          path: apk

      - name: Publish personal test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp apk/*.apk outing-debug.apk
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" outing-debug.apk --clobber
          else
            gh release create "$RELEASE_TAG" outing-debug.apk \
              --verify-tag --prerelease --title "Outing $RELEASE_TAG" \
              --notes 'Android test build. Download outing-debug.apk below. This is a debug-signed APK, not a Play Store release. Updating an APK signed with another key may require uninstalling the previous app, which removes its local data.'
          fi
